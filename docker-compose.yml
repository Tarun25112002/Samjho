services:
  postgres:
    image: postgres:18-alpine
    container_name: medhavi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: medhavi
      POSTGRES_PASSWORD: medhavi
      POSTGRES_DB: medhavi
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+ expects the mount at /var/lib/postgresql, not .../data.
      # The image stores data in a major-version subdirectory so `pg_upgrade
      # --link` works across versions; mounting at /data refuses to start.
      - medhavi-pgdata:/var/lib/postgresql
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      # Without this, `docker compose up -d` returns as soon as the container
      # starts — which is several seconds before Postgres accepts connections.
      test: ["CMD-SHELL", "pg_isready -U medhavi -d medhavi"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  medhavi-pgdata:
