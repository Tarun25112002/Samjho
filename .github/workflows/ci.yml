name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A new push to a PR cancels the previous run — no point burning minutes on
  # a commit that has already been superseded.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  verify:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: samjho
          POSTGRES_PASSWORD: samjho
          POSTGRES_DB: samjho_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U samjho"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # CI has no .env files — the whole point of validating config at boot is
      # that the platform can inject these instead. Anything that *requires* a
      # .env file on disk is a bug, and this job is what catches it.
      DATABASE_URL: "postgresql://samjho:samjho@localhost:5432/samjho_test?schema=public"
      API_URL: "http://localhost:4000"
      NEXT_PUBLIC_API_URL: "http://localhost:4000"

      # Placeholder Clerk credentials.
      #
      # Both apps validate their configuration at boot, and `next build`
      # prerenders pages that mount ClerkProvider — so a build with no Clerk
      # values fails, which is the config validation doing its job. These are
      # structurally valid but belong to no real instance: the publishable key
      # is `pk_test_` + base64("test.clerk.accounts.dev$"), which is all Clerk's
      # parser needs to extract a frontend API host.
      #
      # No test reaches Clerk. Token verification is exercised against a locally
      # generated RSA key pair, so CI proves the auth code without an account and
      # without a secret in the repository. If a test ever *does* need to reach
      # Clerk, it will fail here — loudly, which is correct.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_dGVzdC5jbGVyay5hY2NvdW50cy5kZXYk"
      CLERK_SECRET_KEY: "sk_test_ci_placeholder_not_a_real_key"
      CLERK_ISSUER_URL: "https://test.clerk.samjho.invalid"
      CLERK_WEBHOOK_SIGNING_SECRET: "whsec_c2FtamhvLXRlc3Qtc2lnbmluZy1rZXkh"

    steps:
      - uses: actions/checkout@v7

      # Must precede setup-node: the `cache: pnpm` option below needs the pnpm
      # binary on PATH to resolve the store location.
      # No `version` input — it is inferred from `packageManager` in the root
      # package.json, so the version lives in exactly one place.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # --frozen-lockfile fails if the lockfile doesn't match package.json,
      # rather than silently resolving different versions than a developer ran.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @samjho/api db:generate

      # The database-constraint tests need a migrated schema. Applying the
      # migrations here also verifies that they run cleanly from scratch — the
      # one thing a developer's incrementally-migrated local database can never
      # tell you, and the failure mode that only surfaces during a deploy.
      - name: Apply migrations
        run: pnpm --filter @samjho/api db:deploy

      # Identical to what `pnpm check` runs locally — format, then one turbo
      # invocation so tasks run in dependency order and in parallel where they
      # can (`^build` means packages/contracts compiles before its consumers).
      - name: Verify
        run: pnpm check
